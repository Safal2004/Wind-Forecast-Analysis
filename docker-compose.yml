services:
  backend:
    build:
      context: ./backend
    environment:
      ELEXON_BASE_URL: https://data.elexon.co.uk
      ELEXON_API_KEY: ${ELEXON_API_KEY:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
